apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: biochubs-api
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        # Autoscaling
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '10'
        
        # Cloud SQL connection (update with your instance)
        # run.googleapis.com/cloudsql-instances: PROJECT:REGION:INSTANCE
        
        # Resource limits
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'false'
    spec:
      # Container timeout
      timeoutSeconds: 300
      
      # Service account (optional, use default compute service account if not specified)
      # serviceAccountName: biochubs-api@PROJECT.iam.gserviceaccount.com
      
      containers:
      - name: biochubs-api
        # Update with your image URL
        image: us-central1-docker.pkg.dev/PROJECT/biochubs/biochubs-api:latest
        
        ports:
        - name: http1
          containerPort: 8000
        
        env:
        # Database connection - REQUIRED
        # Use Secret Manager for production (recommended)
        - name: POSTGRES_URI
          value: "postgresql://postgres:PASSWORD@/hubs_dev?host=/cloudsql/PROJECT:REGION:INSTANCE"
        
        # Optional: Application configuration
        # - name: LOG_LEVEL
        #   value: "info"
        
        # For Secret Manager (recommended for production):
        # - name: POSTGRES_URI
        #   valueFrom:
        #     secretKeyRef:
        #       name: postgres-uri
        #       key: latest
        
        resources:
          limits:
            memory: 1Gi
            cpu: '1'
        
        # Startup probe - gives the app time to start
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 0
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        
        # Liveness probe - checks if app is running
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 30
          failureThreshold: 3
  
  traffic:
  - percent: 100
    latestRevision: true
